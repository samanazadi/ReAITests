<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="productsSection" class="products-section">
    <table th:replace="~{products :: productsTable}"></table>
    <wa-card th:replace="~{products :: productForm('Add product', 'post', '/products', '#products', 'Save product')}"></wa-card>
</div>

<table th:fragment="productsTable" class="products-table">
    <thead>
    <tr>
        <th></th>
        <th></th>
        <th>Title</th>
        <th>Vendor</th>
        <th>Type</th>
        <th>Variants</th>
        <th>Availability</th>
        <th class="price">Price</th>
        <th></th>
    </tr>
    </thead>
    <tbody th:each="product : ${products}" th:id="|product-${product.id}|">
        <tr class="product-row">
            <td>
                <wa-button size="small" appearance="plain"
                           th:hx-get="@{/products/{id}/variants(id=${product.id})}"
                           th:hx-target="|#variants-${product.id}|"
                           hx-trigger="click once"
                           onclick="this.closest('tr').nextElementSibling.toggleAttribute('hidden')">
                    <wa-icon name="chevron-right" label="Toggle variants"></wa-icon>
                </wa-button>
            </td>
            <td>
                <img th:if="${product.thumbnailSrc}" class="thumbnail"
                     th:src="${product.thumbnailSrc.contains('?') ? product.thumbnailSrc + '&width=96' : product.thumbnailSrc}"
                     th:alt="${product.title}" loading="lazy">
            </td>
            <td class="title" th:text="${product.title}"></td>
            <td th:text="${product.vendor}"></td>
            <td th:text="${product.productType}"></td>
            <td><wa-badge variant="neutral" appearance="filled" th:text="${product.variants.size()}"></wa-badge></td>
            <td>
                <wa-badge th:if="${product.availableCount > 0}" variant="success" appearance="outlined"
                          th:text="|${product.availableCount} of ${product.variants.size()} in stock|"></wa-badge>
                <wa-badge th:unless="${product.availableCount > 0}" variant="danger" appearance="outlined">Sold out</wa-badge>
            </td>
            <td class="price">
                <th:block th:if="${product.minPrice != null}">
                    <span th:text="${#numbers.formatDecimal(product.minPrice, 1, 2, 'POINT')}"></span>
                    <th:block th:if="${product.minPrice != product.maxPrice}">
                        – <span th:text="${#numbers.formatDecimal(product.maxPrice, 1, 2, 'POINT')}"></span>
                    </th:block>
                </th:block>
            </td>
            <td class="actions">
                <wa-button size="small" appearance="plain" th:href="@{/products/{id}/edit(id=${product.id})}">
                    <wa-icon name="pen" label="Edit product"></wa-icon>
                </wa-button>
                <wa-button class="delete-product" size="small" appearance="plain" variant="danger"
                           th:data-product-id="${product.id}" th:data-product-title="${product.title}">
                    <wa-icon name="trash" label="Delete product"></wa-icon>
                </wa-button>
            </td>
        </tr>
        <tr class="variants-row" hidden>
            <td colspan="9" th:id="|variants-${product.id}|">
                <wa-spinner></wa-spinner>
            </td>
        </tr>
    </tbody>
    <tbody th:if="${products.isEmpty()}">
    <tr>
        <td colspan="9" class="empty">No products found.</td>
    </tr>
    </tbody>
</table>

<table th:fragment="variantsTable" class="variants-table">
    <thead>
    <tr>
        <th></th>
        <th>Title</th>
        <th>Availability</th>
        <th class="price">Price</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="variant : ${variants}">
        <td>
            <img th:if="${variant.featuredImageSrc}" class="thumbnail"
                 th:src="${variant.featuredImageSrc.contains('?') ? variant.featuredImageSrc + '&width=96' : variant.featuredImageSrc}"
                 th:alt="${variant.title}" loading="lazy">
        </td>
        <td th:text="${variant.title}"></td>
        <td>
            <wa-badge th:if="${variant.available}" variant="success" appearance="outlined">In stock</wa-badge>
            <wa-badge th:unless="${variant.available}" variant="danger" appearance="outlined">Sold out</wa-badge>
        </td>
        <td class="price" th:text="${#numbers.formatDecimal(variant.price, 1, 2, 'POINT')}"></td>
    </tr>
    </tbody>
</table>

<wa-card th:fragment="productForm(heading, method, action, target, submitLabel)" class="product-form-card">
    <h2 slot="header" th:text="${heading}"></h2>
    <form id="product-form" th:object="${productForm}"
          th:hx-post="${method == 'post'} ? ${action}"
          th:hx-put="${method == 'put'} ? ${action}"
          th:hx-target="${target}">
        <div class="product-fields">
            <wa-input label="Title" name="title" th:value="*{title}" required
                      th:hint="${#fields.hasErrors('title')} ? ${#fields.errors('title')[0]}"
                      th:classappend="${#fields.hasErrors('title')} ? 'invalid'"></wa-input>
            <wa-input label="Vendor" name="vendor" th:value="*{vendor}"></wa-input>
            <wa-input label="Type" name="productType" th:value="*{productType}"></wa-input>
        </div>

        <h3>Variants</h3>
        <p class="form-error" th:if="${#fields.hasErrors('variants')}" th:text="${#fields.errors('variants')[0]}"></p>
        <div class="variant-rows">
            <th:block th:each="variant, stat : *{variants}">
                <div th:replace="~{products :: variantRow(${stat.index}, ${variant})}"></div>
            </th:block>
        </div>
        <template id="variant-row-template">
            <div th:replace="~{products :: variantRow(0, null)}"></div>
        </template>

        <div class="form-actions">
            <wa-button class="add-variant" appearance="outlined">
                <wa-icon slot="start" name="plus"></wa-icon>
                Add variant
            </wa-button>
            <wa-button type="submit" variant="brand" th:text="${submitLabel}"></wa-button>
        </div>
    </form>
</wa-card>

<div th:fragment="variantRow(index, variant)" class="variant-row"
     th:with="prefix=|variants[${index}]|,
              titleError=${variant != null and #fields.hasErrors('variants[__${index}__].title')} ? ${#fields.errors('variants[__${index}__].title')[0]},
              priceError=${variant != null and #fields.hasErrors('variants[__${index}__].price')} ? ${#fields.errors('variants[__${index}__].price')[0]},
              imageError=${variant != null and #fields.hasErrors('variants[__${index}__].imageSrc')} ? ${#fields.errors('variants[__${index}__].imageSrc')[0]}">
    <wa-input label="Variant title" th:name="|${prefix}.title|" th:value="${variant?.title}" required
              th:hint="${titleError}" th:classappend="${titleError != null} ? 'invalid'"></wa-input>
    <wa-input label="Price" type="number" min="0" step="0.01" th:name="|${prefix}.price|" th:value="${variant?.price}" required
              th:hint="${priceError}" th:classappend="${priceError != null} ? 'invalid'"></wa-input>
    <wa-input label="Image URL" type="url" th:name="|${prefix}.imageSrc|" th:value="${variant?.imageSrc}"
              th:hint="${imageError}" th:classappend="${imageError != null} ? 'invalid'"></wa-input>
    <wa-switch th:name="|${prefix}.available|" th:checked="${variant == null or variant.available}">Available</wa-switch>
    <input type="hidden" th:name="|_${prefix}.available|" value="on">
    <wa-button class="remove-variant" appearance="plain" variant="danger">
        <wa-icon name="trash" label="Remove variant"></wa-icon>
    </wa-button>
</div>
</body>
</html>
