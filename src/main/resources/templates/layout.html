<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="pageHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}"></title>
    <script>
        {
            const darkMode = window.matchMedia("(prefers-color-scheme: dark)");
            const applyColorScheme = () => document.documentElement.classList.toggle("wa-dark", darkMode.matches);
            applyColorScheme();
            darkMode.addEventListener("change", applyColorScheme);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/htmx.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css">
    <script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/utilities.css">
    <link rel="stylesheet" href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/native.css">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
<header th:fragment="pageHeader(active, heading)">
    <nav>
        <wa-button href="/" th:appearance="${active == 'products'} ? 'filled' : 'plain'">Products</wa-button>
        <wa-button href="/search" th:appearance="${active == 'search'} ? 'filled' : 'plain'">Search</wa-button>
    </nav>
    <h1 th:text="${heading}"></h1>
</header>

<wa-dialog th:fragment="deleteDialog" id="delete-dialog" label="Delete product">
    <p>Are you sure you want to delete <strong class="delete-product-title"></strong>?</p>
    <wa-button slot="footer" appearance="outlined" data-dialog="close">Cancel</wa-button>
    <wa-button slot="footer" id="confirm-delete" variant="danger"
               hx-status:404="swap:delete" hx-status:5xx="swap:none">Delete</wa-button>
</wa-dialog>
</body>
</html>
