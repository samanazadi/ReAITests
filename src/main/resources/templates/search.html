<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: pageHead('Search products')}"></head>
<body>
<header th:replace="~{layout :: pageHeader('search', 'Search products')}"></header>
<main>
    <form class="search-form" action="/search" hx-get="/search/results" hx-target="#search-results"
          hx-trigger="input delay:300ms, wa-clear, submit">
        <wa-input type="search" name="q" label="Search by title" placeholder="e.g. jeans" th:value="${q}"
                  clearable autofocus>
            <wa-icon slot="start" name="magnifying-glass"></wa-icon>
        </wa-input>
        <wa-select name="type" label="Type" placeholder="All types" with-clear>
            <wa-option th:value="${noType}" th:selected="${type == noType}">No type</wa-option>
            <wa-option th:each="productType : ${types}" th:value="${productType}" th:text="${productType}"
                       th:selected="${type == productType}"></wa-option>
        </wa-select>
        <wa-switch name="inStock" th:checked="${inStock}">In stock only</wa-switch>
    </form>
    <section id="search-results">
        <table th:replace="~{products :: productsTable}"></table>
    </section>
</main>
<wa-dialog th:replace="~{layout :: deleteDialog}"></wa-dialog>
</body>
</html>
